<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/utileria.js" defer ></script>
    <script src="js/login.js" defer ></script>
</head>
<body>
    <div class="contenedor">
        <h1>INICIAR SESIÓN</h1>

        <form id="formLogin">
            <label for="correo">Correo electrónico</label>
            <input type="correo" id="correo" placeholder="ejemplo@correo.com">

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña">

            <button type="submit">Entrar</button>
        </form>
        <p id="mensajeLogin"></p>
        <p>¿No tienes cuenta?
            <a href="index.html">Registrate aquí</a>
        </p>
    </div>
    
    <!-- MODAL -->
    <div id="modalLogin" class="modal">
        <div class="modal-contenido">
            <span id="cerrarModalLogin" class="cerrar">&times;</span>
            <h2>Inicio de sesión exitoso</h2>
            <p id="resultadoLogin"></p>
            <button id="aceptarModalLogin">Aceptar</button>
        </div>
    </div>
</body>
</html>
